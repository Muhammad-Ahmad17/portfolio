<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes swipe {
        0% {
          transform: translateY(0) opacity(1);
        }
        25% {
          transform: translateY(-60px) opacity(0.8);
        }
        75% {
          transform: translateY(-60px) opacity(0.8);
        }
        100% {
          transform: translateY(0) opacity(1);
        }
      }
      
      @keyframes fingerFlick {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      
      .finger {
        animation: swipe 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      .glow {
        animation: fingerFlick 2s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Glow effect behind finger -->
  <circle cx="512" cy="512" r="80" fill="var(--_theme---foreground-primary)" opacity="0.1" class="glow"/>
  
